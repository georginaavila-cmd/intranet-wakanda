/* Si en 20 segundos la intranet no arrancó (red lenta, bloqueo de un antivirus o extensión), mostrar qué hacer. */
setTimeout(function () {
  var app = document.getElementById('app');
  if (!app || !app.querySelector('.cargando')) return;
  app.innerHTML = '<div class="cargando" style="flex-direction:column;gap:14px;text-align:center;padding:24px">' +
    '<b style="font-size:18px;color:#1f3b5c">La intranet está tardando en cargar</b>' +
    '<span style="max-width:460px">Revisa tu conexión a internet y vuelve a intentar. Si sigue igual, abre la intranet en una ventana de incógnito (Ctrl+Shift+N) o en otro navegador, y avísale a la administración.</span>' +
    '<button type="button" onclick="location.reload()" style="padding:10px 22px;border:0;border-radius:10px;background:#0f8f8a;color:#fff;font-weight:600;cursor:pointer">Reintentar</button></div>';
}, 20000);
</script>
